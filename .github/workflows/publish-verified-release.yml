name: Publish verified Rastix release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID
        required: true
        type: string
      release_tag:
        description: Existing draft release tag (rastix-vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Verify build and publish artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Invalid run ID' }
          if ($env:RELEASE_TAG -notmatch '^rastix-v(\d+\.\d+\.\d+)$') { throw 'Invalid release tag' }
          $version = $Matches[1]
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/rtl-build.yml') { throw 'Expected a successful Rastix build' }
          $draft = @(gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json | Where-Object tag_name -eq $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0 -or $draft.Count -ne 1 -or -not $draft[0].draft -or $draft[0].target_commitish -ne $run.head_sha) { throw 'Draft release must target the verified build commit' }
          $refs = @(gh api "repos/$env:GH_REPO/git/matching-refs/tags/$env:RELEASE_TAG" | ConvertFrom-Json | Where-Object ref -eq "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0 -or $refs.Count -gt 1) { throw 'Release tag lookup failed' }
          if ($refs.Count -eq 1 -and ($refs[0].object.type -ne 'commit' -or $refs[0].object.sha -ne $run.head_sha)) { throw 'Release tag must point to the verified build commit' }
          gh run download $env:BUILD_RUN_ID --name Rastix-Windows-x64 --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          Set-Location release
          $expected = @("Rastix-Setup-v$version.exe", "Rastix-Portable-v$version.zip")
          $entries = @(Get-Content SHA256SUMS.txt)
          if ($entries.Count -ne 2) { throw 'Expected two checksums' }
          $seen = @()
          foreach ($entry in $entries) {
            $parts = $entry -split '  ',2
            if ($parts.Length -ne 2 -or $parts[1] -notin $expected -or $parts[1] -in $seen) { throw 'Unexpected checksum entry' }
            $seen += $parts[1]
            if ((Get-FileHash $parts[1] -Algorithm SHA256).Hash -ne $parts[0]) { throw 'Checksum mismatch' }
          }
          if ((Get-Item $expected[0]).Length -lt 1000000) { throw 'Setup is unexpectedly small' }
          $process = Start-Process (Resolve-Path $expected[0]) -ArgumentList /verify -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Setup verification failed' }
          $release = gh api "repos/$env:GH_REPO/releases/$($draft[0].id)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.draft) { throw 'Expected an existing draft release' }
          if ($refs.Count -eq 0) {
            gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$($run.head_sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed' }
          }
          gh release upload $env:RELEASE_TAG @expected SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $assets = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release asset lookup failed' }
          foreach ($name in ($expected + @('SHA256SUMS.txt'))) {
            $asset = @($assets.assets | Where-Object name -eq $name)
            if ($asset.Count -ne 1 -or $asset[0].size -ne (Get-Item $name).Length) { throw "Incomplete asset: $name" }
          }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
