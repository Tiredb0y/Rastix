name: Build Rastix Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rtl-build
    tags:
      - 'rastix-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content src/cascadia/CascadiaPackage/Package-Dev.appxmanifest
          $version = [version]$manifest.Package.Identity.Version
          $expected = "rastix-v$($version.Major).$($version.Minor).$($version.Build)"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Expected tag $expected, got $env:GITHUB_REF_NAME." }

      - name: Install repository Visual Studio components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsInstall = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          if (-not (Test-Path $vsInstall)) { throw 'VS 2026 Enterprise was not found on the runner.' }
          $setup = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe'
          $arguments = "modify --installPath `"$vsInstall`" --config .vsconfig --quiet --norestart"
          $installer = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($installer.ExitCode -ne 0 -and $installer.ExitCode -ne 3010) { throw "Visual Studio component installation failed with exit code $($installer.ExitCode)." }

      - name: Test installer verification and reject invalid payloads
        shell: pwsh
        run: ./installer/Test-Installer.ps1

      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = '927f62e4b8838bd7e441e9c45103a16ffd75007e'
          git clone https://github.com/microsoft/vcpkg.git dep/vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone vcpkg.' }
          git -C dep/vcpkg checkout $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out the repository vcpkg baseline.' }
          & .\dep\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'Could not bootstrap vcpkg.' }

      - name: Download NuGet CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/v6.12.1/nuget.exe' -OutFile $nuget
          if (-not (Test-Path $nuget) -or (Get-Item $nuget).Length -lt 1000000) { throw 'NuGet CLI download is missing or incomplete.' }

      - name: Build unsigned package for unpackaged layout generation
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "VcpkgRoot=%GITHUB_WORKSPACE%\dep\vcpkg"
          "%RUNNER_TEMP%\nuget.exe" restore dep\nuget\packages.config -PackagesDirectory packages -ConfigFile NuGet.config -Verbosity quiet
          if errorlevel 1 exit /b %ERRORLEVEL%
          msbuild.exe OpenConsole.slnx /t:Terminal\CascadiaPackage /p:Configuration=Release /p:Platform=x64 /p:AppxSymbolPackageEnabled=false /m /v:minimal > build-ci.log 2>&1
          set "BUILD_EXIT=%ERRORLEVEL%"
          type build-ci.log
          exit /b %BUILD_EXIT%

      - name: Build and run Unicode keyboard regression tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %ERRORLEVEL%
          set "VcpkgRoot=%GITHUB_WORKSPACE%\dep\vcpkg"
          msbuild.exe src\terminal\adapter\ut_adapter\Adapter.UnitTests.vcxproj /p:SolutionDir=%GITHUB_WORKSPACE%\ /p:Configuration=Release /p:Platform=x64 /m /v:minimal >> build-ci.log 2>&1
          if errorlevel 1 exit /b %ERRORLEVEL%
          bin\x64\Release\te.exe bin\x64\Release\ConAdapter.Unit.Tests.dll /name:*KittyKeyboardProtocolTests* /inproc
          exit /b %ERRORLEVEL%

      - name: Build and verify unsigned Rastix installer and portable ZIP
        shell: pwsh
        run: ./installer/Build-Installer.ps1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rastix-build-log
          path: build-ci.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows artifacts for CI builds
        if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Rastix-Windows-x64
          path: |
            out/release/Rastix-Setup-v*.exe
            out/release/Rastix-Portable-v*.zip
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach EXE, portable ZIP, and hashes to GitHub Release
        if: startsWith(github.ref, 'refs/tags/rastix-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rastix ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            out/release/Rastix-Setup-v*.exe
            out/release/Rastix-Portable-v*.zip
            out/release/SHA256SUMS.txt
